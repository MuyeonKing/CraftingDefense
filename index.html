<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#14161b" />
    <title>CraftingDefense</title>
  </head>
  <body>
    <div id="app">
      <main id="screens">
        <section class="screen" data-screen="equip" hidden>
          <h2>장비</h2>
          <p class="placeholder">장비창은 5단계에서 구현합니다.</p>
        </section>
        <section class="screen" data-screen="bag" hidden></section>
        <section class="screen" data-screen="home">
          <h2>홈</h2>
          <p class="placeholder">캐릭터와 스테이지 배경은 이후 구현합니다.</p>
        </section>
        <section class="screen" data-screen="battle" hidden>
          <div id="game"></div>
        </section>
        <section class="screen" data-screen="settings" hidden></section>
      </main>
      <nav id="tabbar">
        <button type="button" data-tab="equip">장비</button>
        <button type="button" data-tab="bag">가방</button>
        <button type="button" data-tab="home" class="active">홈</button>
        <button type="button" data-tab="battle">전투</button>
        <button type="button" data-tab="settings">설정</button>
      </nav>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
